name: Build Flatpak

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Everything happens in one job: compile the shell and backend on the runner
  # (where the toolchains and network are available), package the Flatpak, smoke
  # test it, and publish a release. No artifacts are uploaded, so runs do not
  # consume Actions storage.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev librsvg2-dev \
            curl elfutils flatpak flatpak-builder

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install yarn
        run: npm install -g yarn@1.22.22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build shell
        run: ./scripts/build-app.sh

      - name: Build backend
        run: ./scripts/build-backend.sh

      - name: Install Flatpak runtime
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//48 org.gnome.Sdk//48

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean --disable-rofiles-fuse --repo=repo build flatpak/io.frappe.Books.yml
          flatpak build-bundle repo io.frappe.Books.flatpak io.frappe.Books

      - name: Smoke-test the bundle
        run: |
          flatpak install --user -y --noninteractive io.frappe.Books.flatpak
          flatpak run --command=sh io.frappe.Books -c '
            set -e
            /app/books/bench/env/bin/python -c "import frappe, sqlite3; print(\"frappe\", frappe.__version__)"
            /app/bin/redis-server --version
            /app/bin/bench --version

            WS=$XDG_DATA_HOME/ci-bench
            rm -rf "$WS"; mkdir -p "$WS"
            for e in apps env patches.txt Procfile; do ln -s "/app/books/bench/$e" "$WS/$e"; done
            cp -a /app/books/bench/sites "$WS/sites"
            mkdir -p "$WS/logs" "$WS/config/pids" "$WS/redis"
            cp -a /app/books/bench/config/. "$WS/config/"
            /app/bin/redis-server --port 11000 --bind 127.0.0.1 --dir "$WS/redis" --save "" --appendonly no --pidfile "$WS/redis/q.pid" --logfile "$WS/redis/q.log" &
            /app/bin/redis-server --port 13000 --bind 127.0.0.1 --dir "$WS/redis" --save "" --appendonly no --pidfile "$WS/redis/c.pid" --logfile "$WS/redis/c.log" &
            sleep 1
            cd "$WS"
            /app/bin/bench --site site1 serve --port 8020 > "$WS/logs/serve.log" 2>&1 &
            if curl -fsS --retry 30 --retry-delay 2 --retry-connrefused --max-time 5 http://127.0.0.1:8020/api/method/ping; then
              echo "backend ping OK"
            else
              echo "backend ping FAILED"; tail -40 "$WS/logs/serve.log"; exit 1
            fi
          '

      - name: Publish release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Frappe Books v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: io.frappe.Books.flatpak
          make_latest: true
          body: |
            Frappe Books as a self-contained desktop app, built from
            `${{ github.sha }}`.

            ### Install

            ```bash
            flatpak install --user ./io.frappe.Books.flatpak
            flatpak run io.frappe.Books
            ```

            The app runs entirely locally: a bundled Frappe backend, a
            single-file SQLite database and Redis, with no network access.
            See the README for details.
